            - heading "À propos de la série" [level=2] [ref=e344]
            - paragraph [ref=e345]: Œuvre majeure de la littérature d’idées, actuellement au programme du baccalauréat de français, le Discours de la servitude volontaire écrit au 16e siècle par Étienne de La Boétie est une violente critique de la tyrannie en même temps qu’une dénonciation de la lâcheté des peuples.
            - generic [ref=e347]:
              - paragraph [ref=e348]:
                - text: Dans
                - emphasis [ref=e349]: Discours de la servitude volontaire
                - text: ", Etienne de La Boétie interroge la légitimité de toute domination autoritaire et la raison pour laquelle des peuples entiers consentent à se soumettre au pouvoir d’un seul. Il part d’un constat : les hommes sont faits pour être libres, or ils acceptent d’être dominés et soutiennent eux-mêmes le pouvoir des tyrans. Ce faisant, La Boétie définit le concept de “servitude volontaire” : élevés dans l’obéissance, les hommes perdent le désir même de liberté, leur servitude n’est ainsi pas imposée mais librement consentie. Or, il suffirait de refuser de se soumettre pour que le pouvoir du tyran s’effondre."
                - text: "Violente critique de la tyrannie, mais également dénonciation de la lâcheté du peuple, ce texte politique audacieux est publié en édition complète à titre posthume en 1577. Selon Montaigne, le texte aurait été écrit par La Boétie en 1546 ou en 1548 – à l’âge de 16 ou de 18 ans : la France est alors une monarchie absolue de droit divin, marquée par des révoltes paysannes et par les conflits entre catholiques et protestants."
                - text: Le texte constitue une œuvre majeure de la philosophie politique et figure actuellement au programme de l’épreuve anticipée de français au baccalauréat général et technologique.

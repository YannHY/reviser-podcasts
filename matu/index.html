<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réviser avec les podcasts</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    (() => {
      try {
        if (localStorage.getItem("bac-podcasts-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="../styles.css?v=20260523-2">
  <link rel="stylesheet" href="matu.css">
</head>
<body class="matu-page">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="menu-microphone" aria-hidden="true">
        <i class="fa-solid fa-microphone-lines"></i>
      </span>
      <p class="eyebrow">Maturité cantonale</p>
      <h1>Réviser avec les podcasts</h1>
      <nav class="quick-menu" aria-label="Accès rapides">
        <a href="../index.html">Accueil</a>
        <a href="index.html" aria-current="page">Podcasts</a>
        <a href="quiz.html">Quiz</a>
        <a href="fiches.html">Fiches</a>
      </nav>
    </div>
    <div class="topbar-tools">
      <div class="topbar-main">
        <div class="header-actions">
          <button id="searchToggle" class="icon-button search-toggle" type="button" aria-label="Rechercher" aria-expanded="false" aria-controls="headerSearch">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          </button>
          <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Activer le mode sombre" title="Activer le mode sombre">
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
        </div>
        <div class="progress-panel" aria-live="polite">
          <span id="progressText">Chargement...</span>
          <div class="progress-track" aria-hidden="true">
            <span id="progressBar"></span>
          </div>
        </div>
      </div>
      <div id="headerSearch" class="header-search" hidden>
        <label for="searchInput" class="sr-only">Rechercher</label>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="searchInput" type="search" placeholder="Auteur, titre, émission...">
        <button id="searchClose" class="icon-button search-close" type="button" aria-label="Fermer la recherche">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Filtres">
      <label>
        <span>Trier</span>
        <select id="sortSelect">
          <option value="source">Par défaut</option>
          <option value="longest">Les plus longs</option>
          <option value="shortest">Les plus courts</option>
          <option value="newest">Les plus récents</option>
          <option value="oldest">Les plus anciens</option>
        </select>
      </label>

      <label>
        <span>Durée max</span>
        <select id="durationFilter">
          <option value="all">Toutes</option>
          <option value="10">≤ 10 min</option>
          <option value="30">≤ 30 min</option>
          <option value="60">≤ 60 min</option>
        </select>
      </label>

      <label>
        <span>État</span>
        <select id="statusFilter">
          <option value="all">Tous</option>
          <option value="todo">À écouter</option>
          <option value="done">Écoutés</option>
        </select>
      </label>
    </section>

    <section class="summary" aria-live="polite">
      <div><strong id="resultCount">0</strong><span>podcasts affichés</span></div>
      <div><strong id="totalTime">0 min</strong><span>temps total</span></div>
      <div><strong id="doneCount">0</strong><span>écoutés</span></div>
    </section>

    <div class="tab-row">
      <nav id="sectionTabs" class="tabs" aria-label="Œuvres"></nav>
      <button id="favoritesToggle" class="favorite-filter" type="button" aria-pressed="false">
        <i class="fa-regular fa-heart" aria-hidden="true"></i>
        <span>Favoris</span>
      </button>
    </div>

    <section id="podcasts" class="podcast-sections" aria-label="Podcasts"></section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="made-with">
        Créé avec <i class="fas fa-heart" aria-hidden="true"></i> par
        <a href="https://www.linkedin.com/in/yann-houry-a2350651/" target="_blank" rel="noopener noreferrer">Yann Houry</a>, responsable de l'innovation à l'institut Florimont de Genève
      </p>
      <div class="license">
        <p xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/">
          <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="license noopener noreferrer" aria-label="Licence Creative Commons BY-SA 4.0">
            <i class="fa-brands fa-creative-commons" aria-hidden="true"></i>
          </a>
          <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="license noopener noreferrer" aria-label="Attribution requise">
            <i class="fa-brands fa-creative-commons-by" aria-hidden="true"></i>
          </a>
          <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="license noopener noreferrer" aria-label="Partage dans les mêmes conditions">
            <i class="fa-brands fa-creative-commons-sa" aria-hidden="true"></i>
          </a>
        </p>
      </div>
      <p class="year"><span id="current-year"></span></p>
    </div>
  </footer>
  <script src="podcast-data.js?v=20260523-2" defer></script>
  <script src="../shared.js?v=20260523-2" defer></script>
  <script src="../podcast-page.js?v=20260523-1" defer></script>
  <script src="matu.js?v=20260523-5" defer></script>
</body>
</html>
